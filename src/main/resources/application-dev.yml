spring:
  # Postgres não cria o banco pela URL - o banco "nimbusdesk" precisa existir antes do primeiro
  # boot (ver V20260907_01__init.sql). Defaults abaixo assumem o Postgres nativo local (mesma
  # instância usada por CardsyncServer/NimbusCore, usuário/senha postgres/postgres) - não o
  # Postgres do docker-compose (que continua usando nimbusdesk/changeme-local-only, setado
  # explicitamente via .env para esse caminho).
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_DATABASE:nimbusdesk}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  security:
    oauth2:
      client:
        registration:
          nimbusdesk-bff:
            provider: nimbusdesk-as
            client-id: ${NIMBUSDESK_BFF_CLIENT_ID:nimbusdesk-bff}
            client-secret: ${NIMBUSDESK_BFF_CLIENT_SECRET:changeit-dev}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          nimbusdesk-as:
            # authorization-uri é enviado ao browser (redirect) - precisa ser o issuer público
            # (localhost). token/jwk-set/user-info são chamados pelo backend em si - usam
            # NIMBUS_AUTH_INTERNAL_BASE_URL, que diverge do issuer quando o backend roda
            # containerizado (docker compose) e o NimbusCore roda nativamente no host (ver
            # comentário de NIMBUS_AUTH_INTERNAL_BASE_URL no .env.example).
            authorization-uri: ${nimbus.security.issuer}/oauth2/authorize
            token-uri: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}/oauth2/token
            jwk-set-uri: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}/oauth2/jwks
            user-info-uri: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}/userinfo
            user-name-attribute: sub

server:
  # 9094 - próxima porta livre da convenção do workspace (NimbusCore=9090, CardSync=9091,
  # NimbusFlow=9092, NimbusNovax=9093), evita colidir com os backends já existentes quando todos
  # rodam lado a lado na mesma máquina.
  port: ${SERVER_PORT:9094}
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # dev; em prod true
        same-site: LAX

# Fase 2 do levantamento de duplicação: security/nimbuscore/email eram nimbusdesk.* aqui -
# viraram nimbus.* (prefixo neutro compartilhado com NimbusCommonsServer), com os mesmos env vars
# de sempre do lado direito (nenhuma mudança de env var no Railway, só o caminho na YAML).
nimbus:
  security:
    # Issuer do NimbusCore (real, rodando localmente fora do docker-compose - nem o NimbusCore
    # nem o Cardsync são dockerizados nesta workspace).
    issuer: ${NIMBUS_CORE_ISSUER:http://localhost:9090}

    cookies:
      domain: ${NIMBUSDESK_COOKIE_DOMAIN:}
      secure: ${NIMBUSDESK_COOKIE_SECURE:false}
      same-site: ${NIMBUSDESK_COOKIE_SAMESITE:Lax}

    resource-server:
      enabled: true
      jwk-set-uri: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}/oauth2/jwks

    web:
      spa-base-url: ${NIMBUSDESK_SPA_BASE_URL:http://localhost:4204}
      allowed-origins:
        - ${CORS_ALLOWED_ORIGINS:http://localhost:4204}

  nimbuscore:
    # Mesma base do jwk-set-uri acima (nimbus.security.resource-server.jwk-set-uri), exposta
    # separadamente pra ser reaproveitada nas chamadas REST de perfil/senha
    # (com.nimbussystems.commons.security.NimbusCoreClient).
    base-url: ${NIMBUS_AUTH_INTERNAL_BASE_URL:http://localhost:9090}
    # Mesmo secret compartilhado já configurado no NimbusCore e no CardsyncServer - protege
    # /internal/users (com.nimbusdesk.common.security.NimbusCoreInternalClient/UserDirectoryService).
    internal-api-secret: ${NIMBUS_INTERNAL_API_SECRET:dev-internal-secret-change-me}

  # com.nimbussystems.commons.notification.mail.EmailProperties - fake por default (só loga, sem
  # credencial nenhuma necessária em dev).
  email:
    impl: ${NIMBUSDESK_EMAIL_IMPL:fake}
    from-name: ${NIMBUSDESK_EMAIL_FROM_NAME:NimbusDesk}
    from-email: ${NIMBUSDESK_EMAIL_FROM_EMAIL:naoresponda@nimbussystems.com.br}
    # Base pública DESTE backend (não a de produção!) - com.nimbussystems.commons.notification.
    # mail.EmailProperties#publicBaseUrl, usada pela lib pra montar URLs absolutas quando
    # necessário (ex.: link de anexo/imagem num e-mail).
    public-base-url: ${NIMBUSDESK_API_PUBLIC_BASE_URL:http://localhost:${SERVER_PORT:9094}}
    brevo:
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
      api-key: ${BREVO_API_KEY:}

  # Módulo "Chamados de TI" - integração com o NimbusFlowServer (com.nimbusdesk.common.security.
  # NimbusFlowInternalClient/NimbusFlowInternalProperties). Default local (não containerizado)
  # assume o NimbusFlowServer rodando nativamente na porta 9092 (convenção do workspace); o
  # docker-compose.yml deste projeto sobrescreve pra http://host.docker.internal:9092 quando o
  # NimbusDeskServer roda em container (mesmo padrão de NIMBUS_AUTH_INTERNAL_BASE_URL acima).
  nimbusflow:
    base-url: ${NIMBUS_FLOW_INTERNAL_BASE_URL:http://localhost:9092}
    internal-api-secret: ${NIMBUS_FLOW_INTERNAL_SECRET:dev-flow-internal-secret-change-me}

  # com.nimbusdesk.tickets.core.EquipamentoSyncService - intervalo entre execuções (ms). Default
  # 20 minutos, conforme PROJECT_SPEC.md.
  equipamento-sync:
    interval-ms: ${NIMBUS_EQUIPAMENTO_SYNC_INTERVAL_MS:1200000}

# S3-compatible object storage (MinIO local). Consumido por com.nimbusdesk.common.storage - anexos
# de Chamado. Bucket próprio "nimbusdesk-attachments" (distinto do "nimbusflow-media" do
# NimbusFlowServer).
storage:
  endpoint: ${NIMBUSDESK_STORAGE_ENDPOINT:http://localhost:9010}
  access-key: ${NIMBUSDESK_STORAGE_ACCESS_KEY:nimbusdesk}
  secret-key: ${NIMBUSDESK_STORAGE_SECRET_KEY:changeme-local-only}
  bucket: ${NIMBUSDESK_STORAGE_BUCKET:nimbusdesk-attachments}
