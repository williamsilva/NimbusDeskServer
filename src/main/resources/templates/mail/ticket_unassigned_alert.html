<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chamados sem responsável</title>
  <style>
    body, table, td { margin: 0; padding: 0; }
    body { background: #f1f5f9; font-family: Helvetica, Arial, sans-serif; color: #334155; -webkit-text-size-adjust: 100%; }
    .wrapper { width: 100%; background: #f1f5f9; padding: 24px 0; }
    .container { width: 100%; max-width: 600px; margin: 0 auto; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
    .header { background-color: #4338ca; background-image: linear-gradient(135deg, #818cf8 0%, #6366f1 55%, #4338ca 100%); padding: 22px 28px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 9px; text-align: center; vertical-align: middle; background: rgba(255,255,255,0.22); color: #ffffff; font-weight: bold; font-size: 14px; }
    .brand-name { font-size: 19px; font-weight: bold; color: #ffffff; padding-left: 12px; }
    .brand-tagline { font-size: 10px; color: rgba(255,255,255,0.85); letter-spacing: 0.5px; text-transform: uppercase; padding-left: 12px; }
    .body-content { padding: 28px; }
    .status-pill { display: inline-block; background: #fee2e2; color: #b91c1c; font-weight: bold; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; padding: 5px 12px; border-radius: 20px; border: 1px solid #fecaca; }
    h1 { font-size: 19px; color: #0b1220; margin: 16px 0 6px 0; }
    .intro { font-size: 13.5px; color: #475569; line-height: 1.55; margin: 0 0 20px 0; }
    .rows { width: 100%; border-collapse: collapse; }
    .rows tr + tr td { border-top: 1px solid #e2e8f0; }
    .rows td { padding: 12px 4px; font-size: 13px; vertical-align: top; }
    .row-numero { font-weight: bold; color: #0f172a; white-space: nowrap; }
    .row-titulo { color: #334155; }
    .row-prioridade { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: #64748b; text-align: right; white-space: nowrap; }
    .cta { display: inline-block; margin-top: 22px; background: #4338ca; color: #ffffff !important; text-decoration: none; font-size: 13px; font-weight: bold; padding: 11px 22px; border-radius: 8px; }
    .footer { padding: 20px 28px; text-align: center; font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>
  <table class="wrapper" role="presentation" width="100%">
    <tr><td>
      <table class="container" role="presentation" align="center">
        <tr><td class="card">

          <table role="presentation" width="100%" class="header">
            <tr><td>
              <table role="presentation">
                <tr>
                  <td class="brand-mark">ND</td>
                  <td>
                    <div class="brand-name">NimbusDesk</div>
                    <div class="brand-tagline">Chamados de TI</div>
                  </td>
                </tr>
              </table>
            </td></tr>
          </table>

          <table role="presentation" width="100%">
            <tr><td class="body-content">

              <span class="status-pill" th:text="${count} + ' sem responsável'">-</span>
              <h1>Chamados aguardando atribuição</h1>
              <p class="intro">Os chamados abaixo estão com status Aberto e ainda não têm um responsável atribuído.</p>

              <table role="presentation" width="100%" class="rows">
                <tr th:each="t : ${tickets}">
                  <td class="row-numero" th:text="${t.numero}">-</td>
                  <td class="row-titulo" th:text="${t.titulo}">-</td>
                  <td class="row-prioridade" th:text="${t.prioridade}">-</td>
                </tr>
              </table>

              <a class="cta" th:href="${listUrl}">Ver fila de atendimento</a>

            </td></tr>
          </table>

          <div class="footer">E-mail automático do NimbusDesk &middot; não é necessário responder esta mensagem.</div>

        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
